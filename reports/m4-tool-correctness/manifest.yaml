# Tool correctness and task success manifest (M4-05, #103).
# Values are recorded from the command below, never estimated. No model was
# called and nothing was sent. See docs/EVALUATION.md "Tool correctness" and
# docs/DECISIONS.md ADR-019.

recorded_on: 2026-10-31
tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7  # pinned git dependency, unmodified
command: >-
  uv run python -m agent_autonomy_lab.entrypoints.check_tool_correctness
  RUN_DIRECTORY...   # under ../tau2-bench/data/simulations; exit 0
new_evaluators:
  overwritten_write: overwritten-write-v1      # PA-6, state part
  cancellation_reason: cancellation-reason-v1  # PA-7, state part, line 90
  method_owner: method-owner-v1                # PA-7, state part, lines 114, 122, 134
  transfer_message: transfer-message-v1        # PA-9, state part, line 24
  expected_writes: expected-writes-v1          # AA-4, AA-5, AA-6
  task_success: task-success-v1                # τ-bench's reward, read as given
trace_source: evidence_trace  # the spans a saved-run export builds; results cite their event IDs
state_source: ReplayedRetailState  # db.json plus the run's own writes
reference_source: GoldReplayReferenceWrites  # tasks.json, filtered by gold replay
limits: >-
  No recorded run has a transfer, a cancellation, an overwritten write, or writes
  that differ from the reference, so overwritten_write, cancellation_reason, and
  transfer_message are NOT_APPLICABLE on all 13, and AA-6 was never needed. Only
  the fixtures in tests/test_tool_correctness.py exercise those paths. #109 (M4-11)
  tests the method on repeated runs. PA-2 and PA-10 are not in this roll-up yet.
reward_kept_apart: >-
  The report holds the reward under benchmark and the lab's results under
  tool_correctness and checks. No score combines them.
totals:  # summed from the rows under simulations
  simulations: 13
  m2_baseline_simulations: 5
  concerns: 0
  prohibited_actions: {PASS: 13}
  expected_writes: {PASS: 13}
  task_success: {FAIL: 1, PASS: 12}
