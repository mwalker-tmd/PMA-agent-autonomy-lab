# Rubric judge manifest (M4-07, #105).
# Values are recorded from the command below, never estimated. These are real
# calls on the recorded runs, to check that the judges work end to end. They are
# not a baseline or a calibration. See docs/EVALUATION.md "LLM-as-a-judge design"
# and docs/DECISIONS.md ADR-021.

recorded_on: 2026-11-01
tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7  # pinned git dependency, unmodified
litellm_version: 1.81.11
command: >-
  uv run --env-file ../tau2-bench/.env python -m
  agent_autonomy_lab.entrypoints.judge_rubrics RUN_DIRECTORY...
  # under ../tau2-bench/data/simulations; exit 0
judges:
  clarity_customer_effort: clarity-v1
  conversation_efficiency: efficiency-v1
  escalation_correctness: escalation-v1
model: claude-haiku-5-5
declared_settings: {max_tokens: 2048, output_config: {effort: low}}
effective_settings: {max_tokens: 2048, output_config: {effort: low}}  # read from each request sent
limits: >-
  One run of each judge on 13 simulations, 9 of them task 0, says nothing about how far the scores can be trusted; #110 (M4-12) tests
  that against human labels. No recorded run has a transfer, so the escalation rubric
  never scored a transfer here, and the state check and every transfer path are
  exercised only by the fixtures in tests/test_rubric_judges.py. All 13
  NOT_APPLICABLE results rest on the judge's own report, which #110 also checks.
wrapper_check: >-
  The Milestone 2 run's unwrapped replies sum to 14, matching the 14 of 16 in
  docs/BASELINE.md. One of them, in task 1, holds a raw newline inside the wrapper,
  which strict JSON refuses, so unwrapping parses with strict=False.
cost_note: >-
  cost_usd is LiteLLM's figure, which ADR-020 found equal to usage at the list price.
  This spend is too small to read on a bill. billed_usd stays the authority.
