# Milestone 3 trace run manifest.
# Each section is filled in by the ticket that produces it; values are
# recorded from real commands, never estimated. See docs/ARCHITECTURE.md.

live_run_task_0:  # M3-05 (#75): hook A, docs/ARCHITECTURE.md "Tracing a live run"
  recorded_on: 2026-10-29
  started_at_utc: 2026-10-29T18:39:27Z      # simulation start_time 12:39:27.28 America/Denver
  traffic_type: synthetic
  experiment_class: custom_lab_experiment   # lab agent wrapper; not the baseline
  autonomy_level: "n/a"                     # no authorization gate
  langsmith_project: agent-autonomy-lab-synthetic   # resolved from LANGSMITH_PROJECT
  tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7  # pinned git dependency, unmodified
  agent_version: lab_traced_llm_agent       # registered name; wraps upstream LLMAgent
  command: >-
    uv run --env-file .env --env-file ../tau2-bench/.env
    python -m agent_autonomy_lab.entrypoints.trace_live_run
    --task-id 0 --save-to m3-05-live-task-0
  settings:  # entrypoint defaults, equal to reports/m2-baseline/manifest.yaml run settings
    domain: retail
    task_id: "0"
    model_id: openai/responses/gpt-6-luna
    user_model_id: openai/responses/gpt-6-luna
    llm_args_agent: {reasoning_effort: medium}
    llm_args_user: {reasoning_effort: medium}
    run_seed: 42
    trial_seed: 670487        # same as every baseline simulation
    max_steps: 200
    max_errors: 10
  same_task_as_baseline:
    task_sha256: dd7e6be1fa0f86ec08cd919ccb7562a032df8ddd586b725ef23b94df4d449425  # equals baseline language_tasks["0"].task_sha256
    persona_id: mamadou_diallo                                                    # equals baseline
    policy_version: policy-2c9652afbce5    # environment policy; equals the baseline's info.environment_info.policy
  agent_fingerprint:  # what the agent sends its model besides the conversation
    reference: upstream llm_agent built by build_text_orchestrator for the same task and trial seed
    model_id: openai/responses/gpt-6-luna
    prompt_version: prompt-a0211039d555
    tool_schema_version: tools-7d24cf1501c1
    model_args_version: args-474d78942283
    model_args: {reasoning_effort: medium, seed: 670487}
    traced_turns: 9
    turns_matching_reference: 9
  simulation:
    simulation_id: a428164f-fdfc-4245-b30b-f871b8d62e7f
    termination: user_stop
    reward: 1.0
    reward_breakdown: {DB: 1.0, NL_ASSERTION: 1.0}   # baseline task 0: same
    messages: 20                     # recorded transcript equals the SimulationRun's (role and content)
    tool_calls: [find_user_id_by_name_zip, get_order_details, get_product_details, get_product_details, exchange_delivered_order_items]
    tool_errors: 0
    tokens:
      agent: {calls: 9, prompt: 46564, completion: 1122}
      user: {calls: 5, prompt: 5762, completion: 340}
    cost_usd:  # LiteLLM per-message cost from the SimulationRun; judge calls not recorded
      agent: 0.0016653
      user: 0.0005124
      total: 0.0021777
    saved_to: ../tau2-bench/data/simulations/m3-05-live-task-0/simulation.json  # not committed
    simulation_json_sha256: b604f31e723b112b64441b8f3eda1de62bb0acbdd02e8be4c788dcd00e342496
  langsmith:  # read back through the API after the run
    thread_id: 712f70ea-5fb7-50c5-8c05-44de5a41fd81    # thread_id_for(simulation_id)
    root_run_id: 01a188f5-b82c-7701-9cdd-57f8687c14c7  # trace ID
    runs: {total: 20, chain: 1, llm: 14, tool: 5}       # llm = 9 agent turns + 5 simulated-user calls
    all_children_parented_to_root: true
    roots_in_thread: 1
    root_messages: {inputs: 2, outputs: 18}
    feedback: {reward: 1.0, reward_db: 1.0, reward_nl_assertion: 1.0}
    llm_runs_total_cost_usd: 0.002178   # usage_metadata.total_cost summed; equals cost_usd.total
    secret_values_in_payloads: none     # LANGSMITH_API_KEY and OPENAI_API_KEY values searched for in inputs, outputs, metadata, errors
    sdk_added_metadata: [LANGSMITH_ENDPOINT, LANGSMITH_PROJECT, LANGSMITH_TRACING]  # non-secret settings the SDK copies from the environment; noted for M3-06 (#76)
  overhead:
    method: >-
      Measured directly by the wrapper and the entrypoint, not by comparing
      traced and untraced runs: reasoning models do not repeat a conversation
      from a seed, so wall-clock differences between two live runs would be
      noise. In-loop time is the wrapper's own work per turn (fingerprinting
      what the agent sends and converting messages), outside the delegated
      agent call it times. Post-run time is building the trace events and
      sending them; it happens after the conversation ends.
    simulation_wall_ms: 38058.9
    agent_calls_ms: 23781.0           # wrapper-timed delegated calls; τ-bench generation_time_seconds sum 23740
    in_loop_recording_ms: 30.8        # 9 turns, about 3.4 ms each
    in_loop_share_of_wall: 0.0008     # 0.08 %
    post_run_build_ms: 0.46
    post_run_send_ms: 4204.4          # synchronous sends (auto_batch_tracing=False): 20 runs, then 3 feedback items
  notes: >-
    The first attempt stopped before any model call: OPENAI_API_KEY is set
    only in ../tau2-bench/.env, so the command loads both env files. Nothing
    was saved or sent by that attempt. Importing tau2 runs load_dotenv(),
    which copies the working directory's .env into the process; tests hide
    LangSmith settings with an autouse fixture.

deterministic_replay_task_0:  # M3-07 (#77): behavioral equivalence, docs/ARCHITECTURE.md "Deterministic replay"
  recorded_on: 2026-10-29             # America/Denver; 2026-10-30 UTC
  traffic_type: synthetic
  experiment_class: custom_lab_experiment
  autonomy_level: "n/a"
  langsmith_project: agent-autonomy-lab-synthetic
  tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7
  litellm: 1.81.11
  settings:  # stored in the cassette; equal to live_run_task_0.settings (Milestone 2 baseline defaults)
    domain: retail
    task_id: "0"
    model_id: openai/responses/gpt-6-luna
    user_model_id: openai/responses/gpt-6-luna
    llm_args_agent: {reasoning_effort: medium}
    llm_args_user: {reasoning_effort: medium}
    run_seed: 42
    trial_seed: 670487
    max_steps: 200
    max_errors: 10
  cassette:
    path: cassettes/m3-07-task-0.cassette.json   # ignored by Git (.gitignore: cassettes/, *.cassette.json)
    sha256: ed5187636a8d8ba878ade84e90dbad7b172479b32357220d2f74b7a54734095b
    format: lab-cassette/1
    responses: 15        # every model response of the run: 10 agent, 5 simulated user, 0 judge
    judge_calls: 0       # task 0 has no NL assertions ("No nl_assertions to evaluate") and no communicate checks, so no judge model is called
    http_status: {200: 15}
    stored: request method, URL, body; response status, content type, body; no headers
    api_keys_in_file: none   # OPENAI_API_KEY value searched for
    requests_sent:  # read from the recorded request bodies
      reasoning: absent   # LiteLLM drops reasoning_effort for gpt-6-luna (not in its model map; drop_params); see the note
      seed: absent        # the Responses bridge sends no seed
      responses_report_effort: medium   # every response's reasoning.effort: the model's default
  runs:
    record:
      command: >-
        uv run --env-file .env --env-file ../tau2-bench/.env
        python -m agent_autonomy_lab.entrypoints.cassette_run record
        --cassette cassettes/m3-07-task-0.cassette.json --save-to m3-07-record
      agent_version: lab_untraced_llm_agent   # upstream LLMAgent, unwrapped
      model_calls: live
      started_at_utc: 2026-10-30T02:32:51Z
      simulation_id: c66860b3-9a38-4e33-8048-a5308519edde
      duration_seconds: 39.3
    replay_tracing_off:
      command: >-
        uv run --env-file .env python -m agent_autonomy_lab.entrypoints.cassette_run replay
        --cassette cassettes/m3-07-task-0.cassette.json --save-to m3-07-replay-off
      agent_version: lab_untraced_llm_agent
      model_calls: cassette, 15 of 15 served, no mismatch
      started_at_utc: 2026-10-30T02:33:49Z
      simulation_id: a80c0b3e-2429-41bf-af65-5a251b159c38
      duration_seconds: 0.1
    replay_tracing_on:
      command: >-
        uv run --env-file .env python -m agent_autonomy_lab.entrypoints.trace_live_run
        --replay cassettes/m3-07-task-0.cassette.json --save-to m3-07-replay-on
      agent_version: lab_traced_llm_agent     # TracedAgent around upstream LLMAgent; sent to LangSmith
      model_calls: cassette, 15 of 15 served, no mismatch   # summary.json predates the served field (7b68074); check_complete passed
      started_at_utc: 2026-10-30T02:33:59Z
      simulation_id: 2aeb4ee0-01db-4c46-a5ca-afe17bd80dee
      duration_seconds: 0.1
      agent_fingerprint: {traced_turns: 10, turns_matching_reference: 10}   # same hashes as live_run_task_0.agent_fingerprint
    replay_tracing_off_recheck:  # after b94cfef made request matching type-sensitive (Copilot round 1)
      command: >-
        uv run --env-file .env python -m agent_autonomy_lab.entrypoints.cassette_run replay
        --cassette cassettes/m3-07-task-0.cassette.json --save-to m3-07-replay-off-recheck
      model_calls: cassette, 15 of 15 served, no mismatch
      simulation_id: e3ecd6f6-5aad-4866-b998-e4ff8444f453
      compare_outcomes_with_replay_tracing_off: {differing: [], equivalent: true}
      cassette_sha256_unchanged: true
  comparison:  # compare_outcomes m3-07-replay-off m3-07-replay-on m3-07-record; exit 0
    reference: replay_tracing_off
    equal_fields: [agent_messages, tool_calls, transcript, final_db_hash, termination_reason, reward, reward_breakdown, reward_details]
    replay_tracing_on: {differing: []}
    record: {differing: []}
    equivalent: true
    values:
      messages: 22
      agent_messages: 11            # 10 model replies + the fixed opener
      tool_calls: [find_user_id_by_name_zip, get_order_details, get_user_details, get_product_details, get_product_details, exchange_delivered_order_items]
      tool_errors: 0
      final_db_hash: a109be174767fde0ebb50fe3be37cdb2f1ce017fefd7bd29ea3e4d38bd3ac25a   # live environment after the conversation
      termination: user_stop
      reward: 1.0
      reward_breakdown: {DB: 1.0, NL_ASSERTION: 1.0}
    also_equal_not_compared:  # read from each simulation.json; equal in all three runs
      tokens:
        agent: {calls: 10, prompt: 50612, completion: 1046}
        user: {calls: 5, prompt: 5404, completion: 483}
  langsmith:  # traced replay, read back through the API after the run
    thread_id: 2030b1fd-a6a0-5ee0-bd02-f5a22e17212b    # thread_id_for(simulation_id)
    root_run_id: 01a18aa8-2d1e-7ef9-8c88-250ca1b31a16  # trace ID
    runs: {total: 22, chain: 1, llm: 15, tool: 6}       # llm = 10 agent turns + 5 simulated-user calls = the cassette's 15 responses; tool = the 6 tool calls
    all_children_parented_to_root: true
    roots_in_thread: 1
    thread_and_simulation_ids_on_every_run: one each
    root_messages: {inputs: 2, outputs: 20}
    root_metadata: {traffic_type: synthetic, experiment_class: custom_lab_experiment, autonomy_level: "n/a", agent_version: lab_traced_llm_agent, task_id: "0", policy_version: policy-2c9652afbce5}
    feedback: {reward: 1.0, reward_db: 1.0, reward_nl_assertion: 1.0}
    errors: none
    llm_runs_total_cost_usd: 0.0023448   # LiteLLM's per-message cost, computed from the replayed usage
    secret_values_in_payloads: none      # LANGSMITH_API_KEY and the replay placeholder key searched for
  notes: >-
    A replay recomputes cost from the recorded usage, so cost and tokens match
    the record run; durations do not (0.1 s against 39.3 s), and are not
    compared. Only the tracing-on replay was sent to LangSmith; the record
    run and the tracing-off replay were not traced.
