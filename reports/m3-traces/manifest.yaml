  tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7
  litellm: 1.81.11
  settings:  # stored in the cassette; equal to live_run_task_0.settings (Milestone 2 baseline defaults)
    domain: retail
    task_id: "0"
    model_id: openai/responses/gpt-6-luna
    user_model_id: openai/responses/gpt-6-luna
    llm_args_agent: {reasoning_effort: medium}
    llm_args_user: {reasoning_effort: medium}
    run_seed: 42
    trial_seed: 670487
    max_steps: 200
    max_errors: 10
  cassette:
    path: cassettes/m3-07-task-0.cassette.json   # ignored by Git (.gitignore: cassettes/, *.cassette.json)
    sha256: ed5187636a8d8ba878ade84e90dbad7b172479b32357220d2f74b7a54734095b
    format: lab-cassette/1
    responses: 15        # every model response of the run: 10 agent, 5 simulated user, 0 judge
    judge_calls: 0       # task 0 has no NL assertions ("No nl_assertions to evaluate") and no communicate checks, so no judge model is called
    http_status: {200: 15}
    stored: request method, URL, body; response status, content type, body; no headers
    api_keys_in_file: none   # OPENAI_API_KEY value searched for
    requests_sent:  # read from the recorded request bodies
      reasoning: absent   # LiteLLM drops reasoning_effort for gpt-6-luna (not in its model map; drop_params); see the note
      seed: absent        # the Responses bridge sends no seed
      responses_report_effort: medium   # every response's reasoning.effort: the model's default
  runs:
    record:
      command: >-
        uv run --env-file .env --env-file ../tau2-bench/.env
        python -m agent_autonomy_lab.entrypoints.cassette_run record
        --cassette cassettes/m3-07-task-0.cassette.json --save-to m3-07-record
