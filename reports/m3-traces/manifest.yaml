      simulation_id: c66860b3-9a38-4e33-8048-a5308519edde
      duration_seconds: 39.3
    replay_tracing_off:
      command: >-
        uv run --env-file .env python -m agent_autonomy_lab.entrypoints.cassette_run replay
        --cassette cassettes/m3-07-task-0.cassette.json --save-to m3-07-replay-off
      agent_version: lab_untraced_llm_agent
      model_calls: cassette, 15 of 15 served, no mismatch
      started_at_utc: 2026-10-30T02:33:49Z
      simulation_id: a80c0b3e-2429-41bf-af65-5a251b159c38
      duration_seconds: 0.1
    replay_tracing_on:
      command: >-
        uv run --env-file .env python -m agent_autonomy_lab.entrypoints.trace_live_run
        --replay cassettes/m3-07-task-0.cassette.json --save-to m3-07-replay-on
      agent_version: lab_traced_llm_agent     # TracedAgent around upstream LLMAgent; sent to LangSmith
      model_calls: cassette, 15 of 15 served, no mismatch   # summary.json predates the served field (7b68074); check_complete passed
