    replays of retail task 0. Times cover the whole task, including building
    the run and evaluating it. Mode e goes through build_text_orchestrator and
    run_simulation, not run_single_task, so its shorter time is the shorter
    path, not a speedup, and is not a measure of the wrapper's cost.
