    also_equal_not_compared:  # read from each simulation.json; equal in all three runs
      tokens:
        agent: {calls: 10, prompt: 50612, completion: 1046}
        user: {calls: 5, prompt: 5404, completion: 483}
  langsmith:  # traced replay, read back through the API after the run
    thread_id: 2030b1fd-a6a0-5ee0-bd02-f5a22e17212b    # thread_id_for(simulation_id)
    root_run_id: 01a18aa8-2d1e-7ef9-8c88-250ca1b31a16  # trace ID
    runs: {total: 22, chain: 1, llm: 15, tool: 6}       # llm = 10 agent turns + 5 simulated-user calls = the cassette's 15 responses; tool = the 6 tool calls
