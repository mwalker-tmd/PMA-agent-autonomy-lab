# Milestone 2 baseline run manifest.
# Each section is filled in by the ticket that produces it; values are
# recorded from real commands, never estimated. See docs/BASELINE.md.

setup:  # M2-00 (#38)
  recorded_on: 2026-10-26
  host:
    os: macOS (Darwin 25.5.0, arm64)
  tools:
    uv: 0.11.2
    python: 3.12.0            # uv-managed; selected by upstream .python-version
    python_required: ">=3.12,<3.14"
    system_python: 3.14.3     # out of range; not used
  upstream:
    repository: https://github.com/sierra-research/tau2-bench
    location: ../tau2-bench   # sibling clone, not nested in this repository
    branch: main
    commit: 0c69df456a96aa76a1162591574dad9c427a34d7
    commit_date: 2026-10-24T07:04:33-07:00
    tag: null                 # no tag at this commit
    describe: v2.0.0-62-g0c69df4
    local_modifications: none # `git status` clean after uv sync and smoke test
  dependencies:
    lock_file: uv.lock        # upstream lock, unchanged
    litellm: 1.81.11
  checks:
    check_data: passed        # `uv run tau2 check-data`
    model_smoke_test:
      model: gpt-6-luna
      litellm_model_name: gpt-6-luna   # bare name resolves; no provider prefix needed
      result: passed          # one completion; response model gpt-6-luna, content "OK"
      cost_pricing_known: false        # not in the pinned LiteLLM price map

run:  # M2-03 (#41) — fields follow the DEVELOPMENT.md §5 template
  experiment_id: m2-baseline-2026-10-27-r3
  started_at_utc: 2026-10-27T06:25:07Z
  finished_at_utc: 2026-10-27T06:28:25Z
  traffic_type: synthetic
  experiment_class: official_upstream_baseline  # zero upstream code changes; CLI flags only
  tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7
  tau_bench_task_split: base
  selected_task_ids: ["0", "1", "2", "3", "4"]  # --num-tasks 5 takes the first five, in order
  scenario_manifest_version: null   # no lab scenario manifest yet
  model_id: openai/responses/gpt-6-luna
  user_model_id: openai/responses/gpt-6-luna
  llm_args_agent: {reasoning_effort: medium}
  llm_args_user: {reasoning_effort: medium}
  judge_model:
    nl_assertions: gpt-5.4-mini-2026-03-17   # upstream default (src/tau2/config.py); not recorded in results.json
    communicate: gpt-5.5                      # in the run config; retail reward does not use it
  agent_version: llm_agent           # upstream agent, unmodified
  prompt_version: upstream default at tau_bench_commit
  policy_version: upstream retail policy at tau_bench_commit
  seed: 42
  trials_per_task: 1
  concurrency: 1
  attempts: 3                        # runs of the command; see failed_attempts
  completed: 5                       # in the run of record
  failed_to_run: 0                   # in the run of record
  langsmith_project: null            # tracing arrives in Milestone 3
  report_path: ../tau2-bench/data/simulations/m2-baseline-2026-10-27-r3/results.json  # not committed
  command: >-
    uv run tau2 run --domain retail
    --agent-llm openai/responses/gpt-6-luna --user-llm openai/responses/gpt-6-luna
    --agent-llm-args '{"reasoning_effort": "medium"}'
    --user-llm-args '{"reasoning_effort": "medium"}'
    --num-trials 1 --num-tasks 5 --seed 42 --max-concurrency 1
    --save-to m2-baseline-2026-10-27-r3
  results:  # copied from results.json; no other scores are reported
    - {task_id: "0", reward: 1.0, db_match: true, nl_assertions_met: null, termination: user_stop}
    - {task_id: "1", reward: 1.0, db_match: true, nl_assertions_met: null, termination: user_stop}
    - {task_id: "2", reward: 0.0, db_match: true, nl_assertions_met: [false], termination: user_stop}
    - {task_id: "3", reward: 1.0, db_match: true, nl_assertions_met: [true], termination: user_stop}
    - {task_id: "4", reward: 1.0, db_match: true, nl_assertions_met: [true], termination: user_stop}
  summary:  # as printed by tau2 run
    average_reward: 0.8
    pass_hat_1: 0.8
    infra_errors: 0
  cost:
    source: >-
      Per-message cost computed by LiteLLM during the run and stored in
      results.json. On the 17 calls without cached input it equals tokens x
      the OpenAI list price for gpt-6-luna ($0.10 input / $0.50 output per 1M
      tokens, checked 2026-10-27); the other 63 calls are lower, consistent
      with a prompt-caching discount.
    agent_usd: 0.0082337    # sum of assistant message costs; tau2 reports agent_cost null because the fixed greeting has no cost
    user_usd: 0.0025139     # equals the user_cost tau2 reports
    total_usd: 0.0107476    # agent + user only
    list_price_upper_bound_usd: 0.0379601   # all tokens at list price, no caching
    per_task_usd:  # M2-11 (#49); LiteLLM per-message cost summed per simulation; judge calls excluded
      - {task_id: "0", agent: 0.0017724, user: 0.0005123, total: 0.0022848, list_price_bound: 0.0062958, judge_calls: 0}
      - {task_id: "1", agent: 0.0014209, user: 0.0006351, total: 0.0020560, list_price_bound: 0.0062689, judge_calls: 0}
      - {task_id: "2", agent: 0.0015519, user: 0.0004548, total: 0.0020067, list_price_bound: 0.0080009, judge_calls: 1}
      - {task_id: "3", agent: 0.0016501, user: 0.0004246, total: 0.0020746, list_price_bound: 0.0082617, judge_calls: 1}
      - {task_id: "4", agent: 0.0018383, user: 0.0004871, total: 0.0023255, list_price_bound: 0.0091328, judge_calls: 1}
    tokens:
      agent: {calls: 59, prompt: 320266, completion: 5813}
      user: {calls: 21, prompt: 20970, completion: 1860}
    excluded: NL-assertion judge calls (3 tasks have assertions); results.json records no judge usage
    billed_usd: 0.03        # OpenAI usage dashboard for 2026-10-27, as read by the maintainer; authoritative
    reconciliation: >-
      The dashboard total ($0.03) is about $0.02 above the LiteLLM estimate
      ($0.0107) and below the list-price upper bound ($0.038). Unexplained
      so far. Candidates: the caching discount LiteLLM applied was not
      billed, the unrecorded judge calls, or other usage on the key that
      day. Use billed_usd for budgeting; treat agent_usd/user_usd as
      estimates.
  latency:  # M2-05 (#43); computed from results.json, not printed by tau2 run
    method: >-
      Agent calls: generation_time_seconds from results.json, which
      tau2 times around the LiteLLM completion call (llm_utils.py); the
      5 fixed greetings have none. User calls: tau2 leaves the field null
      on user messages, so the figure is a proxy, the gap between the
      user message's timestamp and the previous message's (local clock;
      also includes inter-turn processing). Task wall time is the
      simulation's duration.
    agent_call_s: {calls: 59, source: generation_time_seconds, median: 1.85, mean: 2.28, max: 8.57, sum: 134.6}
    user_call_s: {calls: 21, source: timestamp_gap_proxy, median: 2.19, mean: 2.48, max: 4.54}
    task_wall_s: {"0": 35.0, "1": 39.1, "2": 34.6, "3": 40.0, "4": 38.1, mean: 37.4}
    run_wall_s: 198   # started_at_utc to finished_at_utc
  errors:  # M2-05 (#43); run of record only
    infra_errors: 0
    tool_errors: 0               # tool messages with error set
    hallucination_retries: 0
  failed_attempts:
    - save_to: m2-baseline-2026-10-27
      started_at_utc: 2026-10-27T06:06:40Z
      args: {agent: gpt-6-luna, user: gpt-6-luna, llm_args: {temperature: 0.0}}  # upstream default
      outcome: 5/5 infra errors, 0 evaluated
      error: "Unsupported value: 'temperature' does not support 0.0 with this model. Only the default (1) value is supported."
    - save_to: m2-baseline-2026-10-27-r2
      started_at_utc: 2026-10-27T06:22:11Z
      args: {agent: gpt-6-luna, user: gpt-6-luna, llm_args: {reasoning_effort: medium}}
      outcome: 5/5 infra errors, 0 evaluated
      error: "Function tools with reasoning_effort are not supported for gpt-6-luna in /v1/chat/completions. To use function tools, use /v1/responses or set reasoning_effort to 'none'."
  upstream_after_run:
    git_status: clean
    git_diff: empty
  notes: >-
    Temperature is not passed: frontier models are replacing it with
    reasoning effort, so reasoning_effort is pinned instead. The
    openai/responses/ prefix routes calls through LiteLLM's Responses API
    bridge, which gpt-6-luna requires for tools with reasoning. With
    reasoning models, seed 42 does not make conversations repeatable.
    Task 2 scored 0 because its one NL assertion failed (the agent said 11
    t-shirt options instead of 10); its DB check passed.
