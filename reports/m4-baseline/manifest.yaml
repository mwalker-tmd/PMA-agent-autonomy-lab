notes:
  exit_code: '1, as designed: hook C''s counts disagreed on 3 simulations and one judge call gave EVALUATOR_ERROR.'
  alignment_rules: 'The two evaluators on the project were disabled by the maintainer. The two Alignment
    rules stayed on: each is a code rule on a corrections dataset with 0 examples and 0 experiments, attached
    to no project. After the run, all 61 traces (this run and the smoke), 1336 spans, had no alignment
    feedback, and both datasets were still empty.'
  budget: within_expected_total is false because the run came in below the range, at $0.5565 against $0.70-$1.10.
  tool_correctness_question: None of 48 correct end states came through other writes, so the open question
    moves to Milestone 5.
  evaluator_error: 'clarity_customer_effort on task 43, trial 0: the model call failed and no response
    was recorded, so its judge cassette holds 2 of 3 calls. Raw outputs were not saved by this commit,
    so the error text and cause are unknown. Later runs save them.'
  hook_c: The callback saw 1137 events against 1134 successful exchanges, one extra in each of 3 simulations,
    and the τ-bench judge counts agree at 27 of 27. Each cassette holds every call the messages and judge
    results show, so none was missed. What the extra events are is unknown, because this commit did not
    keep per-model counts. Later runs do. The OpenAI reconciliation shows the extra events were not unmetered
    OpenAI calls; Anthropic's dashboard cannot show the same.
  sleep: The machine slept on and off, so the run took 109 minutes by the clock and 57 awake. The longest
    simulation was 81 seconds.
  trial_order: 'Whole trials first: trial 0 of all 20 tasks, then 1, then 2.'
  limits: 'Twenty tasks, three trials, synthetic traffic, one model in both roles. Judge prompts have
    no calibration yet, so read escalation_correctness at 3 of 16, among other judged figures, as unverified
    until #110.'
  billing: 'OpenAI''s requests and input tokens equal the three runs'' recorded usage exactly, so no OpenAI
    call escaped the meter. Its bill is about 42% of list price, because list price counts every token
    at the full rate, and it agrees with LiteLLM''s $0.1894 once the τ-bench judge is included, unlike
    the Milestone 2 gap. The cap therefore erred high, which is the safe direction. Anthropic''s chart
    cannot isolate this run: its Haiku figure, read by eye, is an upper bound on these 238 calls, and
    $0.1409 is their measured cost. No lab code calls Sonnet, so that $0.17 is not from this run and its
    source is unknown.'
