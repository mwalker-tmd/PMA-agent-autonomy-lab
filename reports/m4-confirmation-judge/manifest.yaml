# Confirmation judge manifest (M4-08, #106).
# Values are recorded from the commands below, never estimated. These are real
# calls on the recorded runs, to check that the judge works end to end. They are
# not a baseline or a calibration. See docs/EVALUATION.md "Confirmation compliance"
# and docs/DECISIONS.md ADR-022.

recorded_on: 2026-11-01
tau_bench_commit: 0c69df456a96aa76a1162591574dad9c427a34d7  # pinned git dependency, unmodified
litellm_version: 1.81.11
command: >-
  uv run --env-file ../tau2-bench/.env python -m
  agent_autonomy_lab.entrypoints.judge_confirmation RUN_DIRECTORY...
  # under ../tau2-bench/data/simulations; exit 0
part_a_command: >-
  uv run --env-file ../tau2-bench/.env python -m
  agent_autonomy_lab.entrypoints.check_tool_correctness --judge-confirmation
  ../tau2-bench/data/simulations/m2-baseline-2026-10-27-r3
  # exit 1, because task 4 has a concern
judge:
  required_customer_confirmation: confirmation-v1
model: claude-haiku-5-5
declared_settings: {max_tokens: 2048, output_config: {effort: low}}
effective_settings: {max_tokens: 2048, output_config: {effort: low}}  # read from each request sent
trace_source: evidence_trace  # the spans a saved-run export builds; results cite their event IDs
limits: >-
  Fourteen writes, 9 of them task 0, say little about how far the judge can be trusted, and
  the final prompt was written against these same runs. #110 (M4-12) tests it against human
  labels. No recorded run has a cancellation, a failed state check, or an unclear reply, so
  only the fixtures in tests/test_confirmation_judge.py exercise those paths.
prompt_history: >-
  Two earlier forms of confirmation-v1 ran on these inputs and are not committed. The first
  left the order unsettled. Six simulations sent it one identical input, whose reply says
  only "this order", and it gave five 2s and one 1, on m3-07-replay-on. The maintainer
  decided the rule in ADR-022. The second form stated it so that the judge also required the
  customer to repeat the order number, which failed task 2's write with a score of 1. The
  final form says the customer need not repeat any detail.
run_to_run_variation: >-
  Three runs of the final prompt gave the same status and score on all 14 writes. The values
  below are the first run. #110 (M4-12) measures this self-agreement properly.
acceptance_on_the_m2_run: >-
  Task 4's first write is a FAIL with a score of 0, its second a PASS, and the other four
  writes PASS, so there is no difference to explain. Task 4's reward stays 1.0.
part_a_on_the_m2_run:  # from part_a_command; the judge's calls there are separate from the totals
  '0': PASS
  '1': PASS
  '2': PASS
  '3': PASS
  '4': FAIL
cost_note: >-
  cost_usd is LiteLLM's figure, which ADR-020 found equal to usage at the list price.
  This spend is too small to read on a bill. billed_usd stays the authority.
